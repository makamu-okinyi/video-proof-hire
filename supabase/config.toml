project_id = "ngoqbdvbalktlggvhcge"

[auth]
site_url = "https://hr.donjoafrica.com"
additional_redirect_urls = [
  "https://hr.donjoafrica.com",
  "https://hr.donjoafrica.com/",
  "https://hr.donjoafrica.com/**",
  "https://donjoafrica.com",
  "https://donjoafrica.com/",
  "https://donjoafrica.com/**",
  "http://localhost:8080",
  "http://localhost:8080/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false
